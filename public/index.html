<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INNOVISTA Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=direct-killfeed-1">
</head>
<body>
<div id="bgfx3d" aria-hidden="true"></div>
<div class="wrap">
  <div class="title">INNOVISTA<span>LIVE STANDINGS</span></div>
  <div class="match-strip" id="matchMeta"></div>
  <div id="banner"></div>
  <aside class="live-sidebar" aria-label="Match and alive counts">
    <section class="live-card" id="roundDetails"></section>
  </aside>
  <div class="live-layout">
    <aside class="killfeed-panel" aria-label="OBS kill feed video area">
      <div class="killfeed-shell">
        <div class="killfeed-heading">
          <div><span class="killfeed-kicker">LIVE GAME FEED</span><h2>KILL FEED</h2></div>
          <span class="killfeed-live"><i></i> OBS INPUT</span>
        </div>
        <div class="killfeed-viewport" id="obsKillFeedViewport">
          <div class="killfeed-placeholder" id="killFeedPlaceholder">
            <span class="killfeed-crosshair" aria-hidden="true">✛</span>
            <strong>GAME FEED AREA</strong>
            <span>Place the cropped OBS Game Capture here</span>
          </div>
          <span class="killfeed-corner killfeed-corner-tl"></span>
          <span class="killfeed-corner killfeed-corner-tr"></span>
          <span class="killfeed-corner killfeed-corner-bl"></span>
          <span class="killfeed-corner killfeed-corner-br"></span>
        </div>
        <div class="killfeed-footer"><span>ELIMINATION CAM</span><span>INNOVISTA LIVE</span></div>
      </div>
    </aside>
    <div class="table" id="table"></div>
  </div>
  <div class="credit">
    <span>Powered by</span>
    <img src="assets/hld-esports-logo.webp" alt="HLD Esports logo" width="34" height="34" loading="lazy" decoding="async">
    <strong>HLD ESPORTS</strong>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js?v=direct-killfeed-1"></script>
<script src="arena-loader.js"></script>
</body>
</html>
