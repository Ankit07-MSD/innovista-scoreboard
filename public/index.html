<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INNOVISTA Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=round-sidepanel-2">
</head>
<body>
<div id="bgfx3d" aria-hidden="true"></div>
<div class="wrap">
  <div class="title">INNOVISTA<span>LIVE STANDINGS</span></div>
  <div class="match-strip" id="matchMeta"></div>
  <div id="banner"></div>
  <div class="live-layout">
    <div class="table" id="table"></div>
    <aside class="live-sidebar" aria-label="Live match details">
      <section class="live-card" id="roundDetails"></section>
      <section class="live-card comparison-card" id="comparisonCard" hidden>
        <div class="live-card-title">TEAM COMPARISON</div>
        <div class="compare-selects">
          <select id="compareTeamA" aria-label="First team to compare"></select>
          <span>VS</span>
          <select id="compareTeamB" aria-label="Second team to compare"></select>
        </div>
        <div id="teamComparison"></div>
      </section>
      <section class="live-card recap-card" id="matchRecap"></section>
    </aside>
  </div>
  <div class="credit">
    <span>Powered by</span>
    <img src="assets/hld-esports-logo.webp" alt="HLD Esports logo" width="34" height="34" loading="lazy" decoding="async">
    <strong>HLD ESPORTS</strong>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js?v=round-sidepanel-2"></script>
<script src="arena-loader.js"></script>
</body>
</html>
