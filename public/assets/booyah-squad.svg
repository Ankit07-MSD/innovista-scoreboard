<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Original battle royale winner squad">
  <defs>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd7b4"/>
      <stop offset=".58" stop-color="#a8614a"/>
      <stop offset="1" stop-color="#3a1712"/>
    </linearGradient>
    <linearGradient id="blackSuit" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#34383f"/>
      <stop offset=".38" stop-color="#101217"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#9ff8ff"/>
      <stop offset=".5" stop-color="#12d7ff"/>
      <stop offset="1" stop-color="#125dff"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#fff2a4"/>
      <stop offset=".45" stop-color="#ff3b18"/>
      <stop offset="1" stop-color="#6f0300"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8b2"/>
      <stop offset=".52" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="whiteHair" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#d9ecff"/>
      <stop offset="1" stop-color="#6c7d94"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" values="1 0 0 0 1  0 .45 0 0 .22  0 0 .2 0 .05  0 0 0 .85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlowFilter" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 .02  0 0 0 0 .8  0 0 0 0 1  0 0 0 .9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <g opacity=".72">
    <ellipse cx="600" cy="585" rx="430" ry="28" fill="#000" opacity=".55"/>
    <path d="M115 520 C305 460 405 488 582 448 C760 408 897 456 1085 392" fill="none" stroke="#ffd257" stroke-width="10" opacity=".18"/>
    <path d="M185 562 C360 512 489 536 668 492 C829 452 938 497 1108 448" fill="none" stroke="#16f1ff" stroke-width="5" opacity=".16"/>
  </g>

