services:
  - type: web
    name: innovista-scoreboard
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        sync: false
      - key: STATE_FILE
        value: /var/data/state.json
    disk:
      name: scoreboard-data
      mountPath: /var/data
      sizeGB: 1

